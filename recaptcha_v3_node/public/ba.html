<!DOCTYPE HTML>
<html data-sly-use.page="com.usfoods.aem.base.core.models.BasePage" lang="${page.language}"
      data-sly-use.pwa="com.usfoods.aem.base.core.models.PWA"
      data-sly-use.head="head.html"
      data-sly-use.footer="footer.html"
      data-sly-use.redirect="redirect.html"
      data-sly-use.cookieconsent="usf-aem-cloud-base/wcm/components/content/cookie-consent/v1/cookie-consent/cookie-consent.html"
      data-sly-use.tagmanagerbody="tagmanagerbody.html">
    <head data-sly-call="${head.head @ page = page, pwa = pwa}"></head>
    <body class="${page.cssClassNames}"
          data-sly-attribute="${page.dataAttributes}"
          id="${page.pageId}"
          data-page-name="${page.title}"
          data-server="${page.siteName}"
          data-language="${page.language}"
          data-page-type="${page.templateName}"
          data-url="${page.canonicalUrl}"
          data-cmp-data-layer-enabled="${page.data ? true : false}">
        <!-- Adding login container logic to this global so that it gets prioritized in execution order -->
        <script type="text/javascript" charset="UTF-8">
            (() => {
                const getDceCookie = () => {
                    const value = '; ' + document.cookie + ';';
                    const parts = value.split('; DCE_KMLI_MOXE=');
                    return parts.length < 2
                        ? undefined
                        : parts
                            .pop()
                            .split(';')
                            .shift();
                };

                const shouldShowLoggedInContent = () => {
                    try {
                        const userProfileJson = sessionStorage.getItem('userProfile');
                        if (!userProfileJson || userProfileJson === 'undefined') {
                            return true;
                        }
                        const userProfile = JSON.parse(userProfileJson);
                        console.log('userProfile', userProfile);
                        if (!('provisional' in userProfile)) {
                            return true;
                        }
                        return userProfile.provisional !== true;
                    } catch (e) {
                        return true;
                    }
                };

                const updateLoginStateContainer = () => {
                    const authenticated = !!getDceCookie();
                    const showLoggedIn = authenticated && shouldShowLoggedInContent();

                    document.body.classList.remove(
                        'cmp-login-state-container--auth',
                        'cmp-login-state-container--unauth'
                    );

                    if (showLoggedIn) {
                        console.log('showLoggedIn');
                        document.body.classList.add('cmp-login-state-container--auth');
                    } else {
                        console.log('showLoggedOut');
                        document.body.classList.add('cmp-login-state-container--unauth');
                    }
                };

                window.usfUpdateLoginStateContainer = updateLoginStateContainer;
                updateLoginStateContainer();
            })();
        </script>
        <sly data-sly-test.isRedirectPage="${page.redirectTarget && (wcmmode.edit || wcmmode.preview)}"
             data-sly-call="${redirect.redirect @ redirectTarget = page.redirectTarget}"></sly>
        <sly data-sly-test="${!isRedirectPage}">

            <sly data-sly-test="${page.gtmContainerID}">
                <!-- Google Tag Manager (noscript) -->
                <noscript>
                    <iframe src="https://www.googletagmanager.com/ns.html?id=${page.gtmContainerID @ context = 'attribute'}&gtm_auth=${page.gtmAuthID @ context = 'attribute'}&gtm_preview=${page.gtmPreviewID @ context = 'attribute'}&gtm_cookies_win=x" height="0" width="0" style="display:none;visibility:hidden"></iframe>
                </noscript>
                <!-- End Google Tag Manager (noscript) -->
            </sly>
            <sly data-sly-call="${tagmanagerbody.tagmanagerbody @ page = page}"></sly>
            <sly data-sly-test="${page.includeChatbot}"
                 data-sly-resource="${'chatbot' @ resourceType='usf-aem-cloud-base/components/content/chatbot', decorationTagName='div'}"></sly>
            <sly data-sly-include="body.html"></sly>
            <sly data-sly-call="${footer.footer @ page = page, pwa = pwa}"></sly>
        </sly>
    </body>
</html>
